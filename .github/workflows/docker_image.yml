# Builds the ibombit/lighthouse-puppeteer-chrome image from the root Dockerfile.
# Pull requests: build and smoke-test only (nothing is pushed before review).
# Pushes to main: also publish the <lighthouse version>-alpine tag to Docker Hub, unless that tag already
# exists (published tags are never overwritten here; rebuild one on purpose with docker_image_manual.yml),
# and create the GitHub release <package.json version> for it.
name: Docker image

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - .github/workflows/docker_image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - .github/workflows/docker_image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ibombit/lighthouse-puppeteer-chrome

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      published: ${{ steps.publish.outcome == 'success' }}
      version: ${{ steps.version.outputs.version }}
      ref: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the versions
        id: version
        run: |
          lh="$(jq -r '.dependencies.lighthouse // empty' package.json | sed 's/^[~^]//')"
          if ! [[ "$lh" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=package.json::dependencies.lighthouse must be a version like 13.5.0 or ^13.5.0 (got '$lh')"
            exit 1
          fi
          version="$(jq -r '.version // empty' package.json)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=package.json::version must look like 13.5.0 (got '$version')"
            exit 1
          fi
          echo "tag=$lh-alpine" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.title=lighthouse-puppeteer-chrome
            org.opencontainers.image.description=Node.js, Chromium, Lighthouse and Puppeteer for the lightprobe performance tests

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lighthouse-image
          cache-to: type=gha,mode=max,scope=lighthouse-image

      - name: Smoke-test the image
        env:
          REF: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
        run: |
          docker run --rm "$REF" node --version
          docker run --rm "$REF" sh -c 'chromium-browser --version || chromium --version'
          docker run --rm -w / "$REF" node --input-type=module -e "
            const lighthouse = await import('lighthouse');
            const puppeteer = await import('puppeteer');
            console.log('lighthouse and puppeteer load:', typeof lighthouse.default, typeof puppeteer.default);
          "

      - name: Check whether the tag is already published
        id: published
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
        run: |
          if out="$(docker buildx imagetools inspect "$REF" 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Image not pushed::$REF is already on Docker Hub and published tags are not overwritten (use the manual workflow to rebuild it)."
          elif grep -qiE 'not found|manifest unknown' <<< "$out"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not check $REF on Docker Hub: $out"
            exit 1
          fi

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.published.outputs.exists == 'false'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Publish
        id: publish
        if: github.event_name != 'pull_request' && steps.published.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lighthouse-image
          provenance: mode=max
          sbom: true

      - name: Summary
        if: always()
        env:
          REF: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
          EVENT: ${{ github.event_name }}
          EXISTS: ${{ steps.published.outputs.exists }}
          PUBLISHED: ${{ steps.publish.outcome }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            state="built and smoke-tested (pull requests don't push)"
          elif [ "$EXISTS" = "true" ]; then
            state="already on Docker Hub, not overwritten"
          elif [ "$PUBLISHED" = "success" ]; then
            state="published to Docker Hub"
          else
            state="not published (see the failed step)"
          fi
          echo "**\`$REF\`**: $state" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    needs: image
    if: needs.image.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the tag and the release
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.image.outputs.version }}
          IMAGE_REF: ${{ needs.image.outputs.ref }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $VERSION already exists"
            exit 0
          fi
          # Changelog since the previous test-project release (plain x.y.z tags; the framework uses lh-pptr-framework@x.y.z).
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[].tagName | select(test("^[0-9]+[.][0-9]+[.][0-9]+$"))][0] // ""')"
          args=(--title "$VERSION" --target "$GITHUB_SHA" --latest --generate-notes --notes "Docker image: \`$IMAGE_REF\`")
          if [ -n "$previous" ]; then
            args+=(--notes-start-tag "$previous")
          fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" "${args[@]}"
          echo "Created release **$VERSION** for \`$IMAGE_REF\`." >> "$GITHUB_STEP_SUMMARY"
